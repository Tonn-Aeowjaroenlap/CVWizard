$defs:
  Achievement:
    additionalProperties: false
    properties:
      evidence_id:
        pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        title: Evidence Id
        type: string
      description:
        minLength: 1
        title: Description
        type: string
      context:
        minLength: 1
        title: Context
        type: string
      start_date:
        anyOf:
        - format: date
          type: string
        - type: 'null'
        default: null
        title: Start Date
      end_date:
        anyOf:
        - format: date
          type: string
        - type: 'null'
        default: null
        title: End Date
      contribution_scope:
        $ref: '#/$defs/ContributionScope'
      source_ids:
        items:
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
        minItems: 1
        title: Source Ids
        type: array
      verification_status:
        $ref: '#/$defs/VerificationStatus'
      confidence:
        $ref: '#/$defs/Confidence'
      uncertainty:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Uncertainty
      confidentiality:
        $ref: '#/$defs/Confidentiality'
      metrics:
        items:
          $ref: '#/$defs/Metric'
        title: Metrics
        type: array
      notes:
        anyOf:
        - minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Notes
      qualifications:
        items:
          minLength: 1
          type: string
        title: Qualifications
        type: array
      category:
        const: ACHIEVEMENT
        title: Category
        type: string
      title:
        minLength: 1
        title: Title
        type: string
    required:
    - evidence_id
    - description
    - context
    - contribution_scope
    - source_ids
    - verification_status
    - confidence
    - confidentiality
    - category
    - title
    title: Achievement
    type: object
  ApprovalStatus:
    enum:
    - PENDING
    - APPROVED
    - REJECTED
    title: ApprovalStatus
    type: string
  CandidateProfile:
