      discriminator:
        mapping:
          ACHIEVEMENT: '#/$defs/Achievement'
          CERTIFICATION: '#/$defs/Certification'
          EDUCATION: '#/$defs/Education'
          EMPLOYMENT: '#/$defs/EmploymentExperience'
          PROJECT: '#/$defs/Project'
          PUBLICATION: '#/$defs/Publication'
          SKILL: '#/$defs/Skill'
