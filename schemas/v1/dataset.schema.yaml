      - $ref: '#/$defs/Education'
      - $ref: '#/$defs/EmploymentExperience'
      - $ref: '#/$defs/Project'
      - $ref: '#/$defs/Skill'
      - $ref: '#/$defs/Achievement'
      - $ref: '#/$defs/Publication'
      - $ref: '#/$defs/Certification'
    title: Evidence
    type: array
  claims:
